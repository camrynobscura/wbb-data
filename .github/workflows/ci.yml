name: CI

# Type check, formatting and tests on every push and pull request. The tests need no database.
on:
  push:
  pull_request:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs, as in nightly-refresh.yml.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26' # package.json engines
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
