name: CI

# Lint, type check, formatting and tests on every push and pull request. The tests need no database.
on:
  push:
  pull_request:

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs, as in nightly-refresh.yml.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26' # package.json engines
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  # The tests that need a real Postgres (npm run test:db): the migrations, ingest, the league and position
  # averages, the ranks and the API's queries.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The image and settings scripts/test-db.ts uses locally: Supabase's version and sort order.
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=en-US
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26' # package.json engines
          cache: npm

      - run: npm ci
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
