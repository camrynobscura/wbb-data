name: Daily data refresh

# Runs the current-season scrape into Supabase every morning (historical seasons never
# change, so only the in-progress year is refreshed) and pings Telegram/Discord if a featured
# player's identity changed or a team was renamed. Also runnable on demand via the "Run
# workflow" button. (The file keeps its old name so the Actions run history stays in one place.)
on:
  schedule:
    # 6:23 AM Eastern daily (3:23 AM Pacific) — late West-Coast games and ESPN box scores
    # have settled by then. The time zone is explicit (GitHub's default is UTC): at '0 10' UTC
    # with none, every scheduled run started in the 10 AM EASTERN hour (10:37, 10:59, 10:05 on
    # 2026-09-24..26 — ~4 h late, cause unknown). This states the intent directly, follows
    # daylight saving, and sits off the top of the hour ("High load times include the start of
    # every hour" — GitHub docs). If runs still start near 10 AM Eastern, it's something else.
    - cron: '23 6 * * *'
      timezone: 'America/New_York'
  workflow_dispatch: {}

# Never let two refreshes run at once (a slow run overlapping the next tick). Queue
# the newer one rather than cancelling a scrape mid-write.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the full run is ~2 min; this only guards against a hang
    steps:
      - uses: actions/checkout@v5 # v5 runs on Node 24 (v4 → the Node 20 deprecation warning)

      - uses: actions/setup-node@v5 # v5 runs on Node 24
        with:
          node-version: '22' # current LTS; satisfies package.json engines (>=20)
          cache: npm

      - run: npm ci

      - name: Refresh current-season data
        run: npx tsx scripts/refresh-current.ts
        env:
          # Required. Supabase Session-pooler connection string (repo secret).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Change notifications — set whichever you use (Telegram wins if both set).
          # If neither is set, the notification step just logs and skips.
          TELEGRAM_URL: ${{ secrets.TELEGRAM_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
