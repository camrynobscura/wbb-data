name: Daily data refresh

# Runs the current-season scrape into Supabase every morning (historical seasons never
# change, so only the in-progress year is refreshed) and pings Telegram if a featured
# player's identity changed or a team was renamed. Also runnable on demand via the "Run
# workflow" button. (The file keeps its old name so the Actions run history stays in one place.)
on:
  schedule:
    # 1:13 AM Eastern daily (10:13 PM Pacific, the day before) — a last try at an earlier start before
    # moving the trigger off GitHub (2026-09-28). Every scheduled run so far has started hours after
    # its set time, and the lag isn't a fixed offset: 6:00 AM Eastern started 10:37, 10:59, 10:05 AM
    # (2026-09-24..26), 6:23 AM started 11:11 AM (09-27), 4:23 AM started 12:47 PM (09-28). GitHub
    # docs: a schedule "can be delayed during periods of high loads" and "some queued jobs may be
    # dropped". Off the top of the hour ("High load times include the start of every hour"); the
    # time zone is explicit (GitHub's default is UTC) and follows daylight saving. Unmeasured until
    # May: how long ESPN takes to add a finished game to the season totals — a run that starts on
    # time, ~45 min after the last West-Coast game, could show "Stats through" a day ahead of the
    # numbers.
    - cron: '13 1 * * *'
      timezone: 'America/New_York'
  workflow_dispatch: {}

# Never let two refreshes run at once (a slow run overlapping the next tick). Queue
# the newer one rather than cancelling a scrape mid-write.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

# The job only reads this repo; the data goes to Supabase with its own secret. So the job's
# GitHub token can read the code and nothing else (the default scope is a repo setting).
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the full run is ~2 min; this only guards against a hang
    steps:
      # Actions are pinned to full commit SHAs, not tags: a tag can be moved to other code, a
      # commit can't. The comment names the release; the pins are what v5 pointed to on 2026-09-28.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (v5 runs on Node 24)
        with:
          # Don't leave the job's token in .git/config for later steps (npm ci runs packages'
          # install scripts); nothing after checkout talks to GitHub.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (runs on Node 24)
        with:
          node-version: '22' # current LTS; satisfies package.json engines (>=20)
          cache: npm

      - run: npm ci

      - name: Refresh current-season data
        run: npx tsx scripts/refresh-current.ts
        env:
          # Required. Supabase Session-pooler connection string (repo secret).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Change notifications. If it isn't set, the notification step just logs and skips.
          TELEGRAM_URL: ${{ secrets.TELEGRAM_URL }}
